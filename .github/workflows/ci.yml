name: CI Pipeline

# Trigger the workflow on pushes and pull requests to the main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your repository code onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Or your preferred Node version
          cache: 'npm'

      # 3. Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run Astro type checking (catches type or component errors)
      - name: Run Astro Check
        run: npm run check

      # 5. Run unit tests (Vitest)
      - name: Run Unit Tests
        run: npm run test:unit

      # 6. (Optional) Test building the Astro site to ensure no build errors
      - name: Build Project
        run: npm run build